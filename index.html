<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Energy Board Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Energy Board Game</h1>
    <div id="turnIndicator" style="font-size: 20px; margin-bottom: 10px;"></div>


    <label>
    <input type="checkbox" id="autoEndTurn" /> Auto End Turn
    </label>
    <br />
    <label>
    <input type="checkbox" id="autoDisableStrengthen" /> Auto-disable Strengthen
    </label>
    <br />
    <label>
    <input type="checkbox" id="strengthenMode" /> Strengthen Mode
    </label>


    <canvas id="gameCanvas" width="600" height="600" style="border:1px solid black;"></canvas>
    <br />
    <button id="endTurnBtn">End Turn</button>


    <script src="game.js"></script>
  </body>
</html>
